[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dopplergeo"
version = "0.1.0"
description = "Locate a video's recording position from aircraft Doppler curves and ADS-B tracks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "av>=12",
    "soxr>=0.3",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyarrow>=16",
    "pydantic>=2",
    "numba>=0.60",  # ridge tracker DP kernel (tracking._ridge_dp_frames)
]

[project.scripts]
dopplergeo = "dopplergeo.cli:main"

[project.gui-scripts]
dopplergeo-gui = "dopplergeo.gui.app:main"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100", "respx>=0.21", "pytest-qt>=4.4"]
dem = ["rasterio>=1.3"]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13", "keyring>=24"]

[tool.hatch.build.targets.wheel]
packages = ["dopplergeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
